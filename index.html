<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图床 · Tuchuang</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Ctext x='16' y='20' text-anchor='middle' font-size='10' font-family='Arial' font-weight='700' fill='white'%3EIMG%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 认证蒙层 -->
  <div id="auth-overlay" class="overlay">
    <div class="auth-box">
      <div class="auth-logo" aria-hidden="true">IMG</div>
      <h2>Yeadon 图床</h2>
      <p>输入你收到的访问码，就可以上传图片或视频并生成分享链接。</p>
      <form id="auth-form">
        <input class="sr-only" type="text" autocomplete="username" value="friend" aria-hidden="true" tabindex="-1" />
        <input id="auth-input" type="password" placeholder="输入密码" maxlength="20" autocomplete="current-password" />
        <button id="auth-btn" type="submit">进入</button>
      </form>
      <p id="auth-error" class="error hidden">请输入访问码</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="hidden">
    <header>
      <div>
        <div class="logo">Yeadon 图床</div>
        <p class="header-subtitle">拖拽、粘贴或选择图片/视频，可选短期或长期保存。</p>
      </div>
      <div class="header-actions">
        <a class="logout omni-link" href="omni-order/">多平台接单台</a>
        <button id="logout-btn" class="logout">更换访问码</button>
      </div>
    </header>

    <main>
      <div id="status-banner" class="status-banner hidden"></div>

      <section class="flow-import-panel" aria-labelledby="flow-import-title">
        <div>
          <h2 id="flow-import-title">Google Flow 视频转存</h2>
          <p>粘贴公开的 Labs / Flow 分享链接，视频会由 Worker 直接保存到 R2。</p>
        </div>
        <fieldset class="storage-options" aria-label="Flow 视频保存时间">
          <label class="storage-option">
            <input type="radio" name="flow-storage-policy" value="temporary" checked />
            <span>
              <strong>短期保存</strong>
              <small>7 天后自动清理</small>
            </span>
          </label>
          <label class="storage-option">
            <input type="radio" name="flow-storage-policy" value="permanent" />
            <span>
              <strong>长期保存</strong>
              <small>不会被自动清理</small>
            </span>
          </label>
        </fieldset>
        <form id="flow-import-form" class="flow-import-form">
          <label class="sr-only" for="flow-url-input">Google Flow 分享链接</label>
          <input
            id="flow-url-input"
            type="url"
            inputmode="url"
            autocomplete="off"
            placeholder="https://labs.google/fx/tools/flow/shared/video/..."
            required
          />
          <button id="flow-import-btn" class="btn-primary" type="submit">转存到 R2</button>
        </form>
        <p id="flow-import-status" class="flow-import-status" aria-live="polite"></p>
      </section>

      <!-- 上传区域 -->
      <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="选择或拖拽图片和视频上传">
        <div class="drop-inner">
          <div class="drop-icon" aria-hidden="true">+</div>
          <p class="drop-text">把图片或视频放到这里</p>
          <p class="drop-sub">支持拖拽、粘贴截图、点击选择，多文件会依次上传。</p>
          <fieldset class="storage-options compact" aria-label="上传文件保存时间">
            <label class="storage-option">
              <input type="radio" name="upload-storage-policy" value="temporary" checked />
              <span>
                <strong>短期</strong>
                <small>7 天</small>
              </span>
            </label>
            <label class="storage-option">
              <input type="radio" name="upload-storage-policy" value="permanent" />
              <span>
                <strong>长期</strong>
                <small>不自动清理</small>
              </span>
            </label>
          </fieldset>
          <input id="file-input" type="file" accept="image/*,video/*" multiple class="hidden" />
          <button id="pick-btn" class="btn-primary">选择文件</button>
        </div>
      </div>

      <!-- 上传进度 -->
      <div id="progress-area" class="hidden">
        <div class="progress-bar-wrap">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="progress-text">上传中...</p>
      </div>

      <div id="batch-actions" class="batch-actions hidden">
        <button id="copy-all-btn" class="btn-secondary">复制全部链接</button>
        <button id="clear-results-btn" class="btn-secondary danger">清空结果</button>
      </div>

      <!-- 结果列表 -->
      <div id="results" class="results"></div>

      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-head">
          <div>
            <h2 id="history-title">上传记录</h2>
            <p id="history-meta">最近上传的文件会显示在这里。</p>
          </div>
          <div class="history-controls">
            <select id="record-filter" aria-label="筛选上传记录">
              <option value="all">全部记录</option>
              <option value="temporary">短期记录</option>
              <option value="permanent">长期记录</option>
            </select>
            <button id="refresh-records-btn" class="btn-secondary">刷新记录</button>
          </div>
        </div>
        <div id="records" class="results"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
